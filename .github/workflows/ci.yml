
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CafeApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore dependencies
        run: dotnet restore CafeApp.sln

      - name: Build project
        run: dotnet build CafeApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CafeApp.sln --configuration Release --no-build --verbosity normal
